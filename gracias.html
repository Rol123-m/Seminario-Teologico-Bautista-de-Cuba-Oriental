<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Gracias! · Seminario Teológico Bautista</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">

  <!-- PWA Manifest -->
<link rel="manifest" href="manifest.json">
 
  <style>
    body { background: var(--secondary-soft-cream); }
    .thankyou-card {
      background: white;
      border-radius: 40px;
      padding: 50px;
      box-shadow: var(--shadow-hover);
    }
  </style>
</head>
<body class="d-flex align-items-center min-vh-100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6 text-center">
        <div class="thankyou-card">
          <div class="icon-circle mx-auto mb-4" style="width: 100px; height: 100px; background: var(--primary-sacred-gold);">
            <i class="fas fa-check-circle fa-4x text-white"></i>
          </div>
          <h1 class="display-4 font-serif mb-4">¡Gracias por contactarnos!</h1>
          <p class="lead mb-4">Hemos recibido tu mensaje. Un miembro de nuestro equipo se pondrá en contacto contigo en las próximas <strong>24-48 horas hábiles</strong>.</p>
          <p class="text-muted mb-4">Que Dios te bendiga y guíe en tu llamado.</p>
          <hr class="my-4">
          <div class="d-flex gap-3 justify-content-center flex-wrap">
            <a href="index.html" class="btn btn-teal rounded-pill px-4"><i class="fas fa-home me-2"></i>Inicio</a>
            <a href="contacto.html" class="btn btn-outline-teal rounded-pill px-4"><i class="fas fa-envelope me-2"></i>Otro mensaje</a>
          </div>
          <p class="small text-muted mt-4 mb-0">
            <i class="fas fa-phone me-1"></i> +53 22 61 23 45 · 
            <i class="fas fa-envelope ms-2 me-1"></i> secdocestbcor@gmail.com
          </p>
        </div>
      </div>
    </div>
  </div>
  <!-- Registrar Service Worker -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then((registration) => {
          console.log('✅ Service Worker registrado:', registration.scope);
        })
        .catch((error) => {
          console.log('❌ Error al registrar Service Worker:', error);
        });
    });
  }
  
  // Botón de instalación (aparece automáticamente en navegadores compatibles)
  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    
    // Mostrar botón de instalación personalizado (opcional)
    const installBtn = document.getElementById('installBtn');
    if (installBtn) {
      installBtn.style.display = 'block';
      installBtn.addEventListener('click', () => {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('Usuario instaló la PWA');
          }
          deferredPrompt = null;
        });
      });
    }
  });
</script>
</body>
</html>
