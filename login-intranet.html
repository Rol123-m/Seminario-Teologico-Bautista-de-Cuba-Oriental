<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aula Virtual · STBCOR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
  <style>
    body { background: url('https://images.pexels.com/photos/261763/pexels-photo-261763.jpeg?auto=compress&cs=tinysrgb&w=1920') center/cover fixed; }
    .login-card { background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border-radius: 30px; }
  </style>
</head>
<body class="d-flex align-items-center min-vh-100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="login-card p-5 shadow-lg">
          <div class="text-center mb-4">
            <i class="fas fa-cross fa-3x text-gold"></i>
            <h3 class="font-serif mt-3">Aula Virtual</h3>
            <p class="text-muted">Seminario Teológico Bautista de Cuba Oriental</p>
          </div>
          <form>
            <div class="mb-3"><input type="text" class="form-control rounded-pill py-3" placeholder="Usuario"></div>
            <div class="mb-3"><input type="password" class="form-control rounded-pill py-3" placeholder="Contraseña"></div>
            <div class="mb-3 form-check"><input type="checkbox" class="form-check-input" id="remember"><label class="form-check-label" for="remember">Recordar sesión</label></div>
            <button type="submit" class="btn btn-teal w-100 rounded-pill py-3">Acceder al Campus Virtual</button>
          </form>
          <hr class="my-4">
          <p class="small text-center text-muted">¿Olvidaste tu contraseña? Contacta a Secretaría Docente.<br>Acceso exclusivo para estudiantes y facultad.</p>
          <div class="text-center"><a href="index.html" class="text-teal"><i class="fas fa-arrow-left"></i> Volver al sitio</a></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
